source /boot/grub/config.cfg

set default=0
set timeout=12

# ---- Main entry: generated by live-build (boots the live system) ----
@LINUX_LIVE@

# ---- Install Capyloon to disk ----
menuentry "Capyloon x86_64 - 安装到硬盘 Install to Disk" {
	linux	/live/vmlinuz boot=live components quiet splash capyloon.installer
	initrd	/live/initrd.img
}

# ---- Safe mode (fallback graphics) ----
menuentry "Capyloon x86_64 - 安全模式 Safe Mode (nomodeset)" {
	linux	/live/vmlinuz boot=live components quiet splash nomodeset
	initrd	/live/initrd.img
}

# ---- Debug (verbose boot log) ----
menuentry "Capyloon x86_64 - 调试模式 Debug (verbose)" {
	linux	/live/vmlinuz boot=live components
	initrd	/live/initrd.img
}

submenu "其他选项 Options..." {
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI 固件设置 Firmware Settings" {
			fwsetup
		}
	fi
	menuentry "重启 Reboot" {
		reboot
	}
	menuentry "关机 Power Off" {
		halt
	}
}
