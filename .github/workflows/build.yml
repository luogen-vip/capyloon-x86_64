name: Build Capyloon x86_64 ISO

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "复用历史 run 的编译产物（填 run id，如 40810472473）。留空=全部从源码构建"
        required: false
        default: ""

env:
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}

jobs:
  build-gecko:
    name: "1/5 Gecko(b2g) x86_64 源码编译"
    if: ${{ inputs.source_run_id == '' || inputs.source_run_id == null }}
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/lib/jvm /usr/share/mysql /etc/mysql || true
          sudo docker image prune -af || true
          sudo apt-get clean
          df -h /

      - name: 从源码构建 Gecko(b2g)
        run: bash scripts/build-gecko.sh

      - name: 上传 b2g 产物
        uses: actions/upload-artifact@v4
        with:
          name: b2g-tarball
          path: output/*.tar.bz2
          retention-days: 3
          if-no-files-found: error

  build-daemons:
    name: "2/5 api-daemon / b2ghald / ipfsd 编译"
    if: ${{ inputs.source_run_id == '' || inputs.source_run_id == null }}
    # 22.04 on purpose: binaries must link against glibc <= 2.35 so they run
    # on the Debian 12 (glibc 2.36) live system. ubuntu-latest links 2.39.
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 构建 Rust 守护进程
        run: bash scripts/build-daemons.sh

      - name: 上传守护进程产物
        uses: actions/upload-artifact@v4
        with:
          name: daemons
          path: output/*.tar.xz
          retention-days: 3
          if-no-files-found: error

  build-deb:
    name: "3/5 打包 Capyloon deb"
    needs: [build-gecko, build-daemons]
    if: ${{ !cancelled() &&
            (needs.build-gecko.result == 'success' || needs.build-gecko.result == 'skipped') &&
            (needs.build-daemons.result == 'success' || needs.build-daemons.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 下载本 run 的 b2g 产物
        if: ${{ inputs.source_run_id == '' || inputs.source_run_id == null }}
        uses: actions/download-artifact@v4
        with:
          name: b2g-tarball
          path: work/artifacts
      - name: 下载本 run 的守护进程产物
        if: ${{ inputs.source_run_id == '' || inputs.source_run_id == null }}
        uses: actions/download-artifact@v4
        with:
          name: daemons
          path: work/artifacts

      - name: 下载历史 run 的 b2g 产物
        if: ${{ inputs.source_run_id != '' && inputs.source_run_id != null }}
        uses: actions/download-artifact@v4
        with:
          name: b2g-tarball
          path: work/artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.CLOUD_TOKEN }}
      - name: 下载历史 run 的守护进程产物
        if: ${{ inputs.source_run_id != '' && inputs.source_run_id != null }}
        uses: actions/download-artifact@v4
        with:
          name: daemons
          path: work/artifacts
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.CLOUD_TOKEN }}

      - name: 打包 deb
        run: bash scripts/build-deb.sh

      - name: 上传 deb 产物
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: output/*.deb
          retention-days: 3
          if-no-files-found: error

  build-iso:
    name: "4/5 构建 Live ISO"
    needs: [build-deb]
    if: ${{ !cancelled() && needs.build-deb.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: 下载本 run 的 deb 产物
        if: ${{ inputs.source_run_id == '' || inputs.source_run_id == null }}
        uses: actions/download-artifact@v4
        with:
          name: debs
          path: output
      - name: 下载历史 run 的 deb 产物
        if: ${{ inputs.source_run_id != '' && inputs.source_run_id != null }}
        uses: actions/download-artifact@v4
        with:
          name: debs
          path: output
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.CLOUD_TOKEN }}

      - name: 构建 ISO
        run: bash scripts/build-iso.sh

      - name: 上传 ISO
        uses: actions/upload-artifact@v4
        with:
          name: iso
          path: |
            iso/livebuild/*.iso
            iso/livebuild/*.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: "5/5 发布 Release"
    needs: [build-iso]
    if: ${{ !cancelled() && needs.build-iso.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: .

      - name: 创建 Release 并上传 ISO
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v0.1.$(date +%Y%m%d)-r${GITHUB_RUN_NUMBER}"
          ISO=$(ls *.iso | head -1)
          sha256sum "$ISO" > "$ISO.sha256"
          gh release create "$TAG" "$ISO" "$ISO.sha256" \
            --title "Capyloon x86_64 $TAG" \
            --notes "Capyloon OS x86_64 移植版自动构建。

          **使用方法**
          1. 用 Rufus/Etcher/balenaEtcher 将 ISO 写入 U 盘 (4GB+)
          2. 电脑从 U 盘启动 (BIOS 与 UEFI 均支持)
          3. GRUB 菜单选第一项进入系统; 选『安装到硬盘』可安装系统

          **默认账号**: capyloon / capyloon (sudo 免密)
          **TTY 调试**: Ctrl+Alt+F2" || {
            echo "release create failed, trying to update existing tag"
            gh release upload "$TAG" "$ISO" "$ISO.sha256" --clobber || true
          }
